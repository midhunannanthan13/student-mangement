<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Management System</h1>

        <!-- ADD / EDIT FORM -->
        <form id="studentForm">

            <input
                type="text"
                id="name"
                placeholder="Student Name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="text"
                id="course"
                placeholder="Course"
                required
            >

            <input
                type="number"
                id="age"
                placeholder="Age"
                min="1"
                max="120"
                required
            >

            <div class="form-buttons">
                <button type="submit" id="submitBtn">
                    Add Student
                </button>

                <button type="button" id="cancelBtn" class="btn-cancel" hidden>
                    Cancel
                </button>
            </div>

        </form>

        <hr>

        <!-- SEARCH -->
        <input
            type="text"
            id="search"
            placeholder="Search by name, email or course..."
        >

        <h2>Students</h2>

        <!-- Success / error messages appear here -->
        <p id="message" class="message" hidden></p>

        <!-- STUDENT TABLE -->
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Course</th>
                    <th>Age</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="studentTable">
            </tbody>
        </table>

    </div>

    <script src="app.js"></script>

</body>
</html>
